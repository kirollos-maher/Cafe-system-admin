<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Plate Pro — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root { --gold: #C9A050; --gold-dim: #7A6330; --bg: #0c0f12; --bg-raised: #14181d; --bg-sunken: #08090b; --surface: #181d23; --border: #262c33; --border-strong: #3a424c; --text: #eef1f4; --text-dim: #8b95a1; --teal: #2dd4bf; --red: #ef4444; --purple: #a855f7; --font-display: 'Cairo', sans-serif; --font-mono: 'JetBrains Mono', monospace; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-display); background: var(--bg); color: var(--text); min-height: 100vh; }
button, input, select { font-family: inherit; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.screen { display: none; min-height: 100vh; } .screen.active { display: block; }
.centered-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.brand-mark { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }
.brand-title { font-size: 22px; font-weight: 800; margin-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 100%; max-width: 380px; }
.field { margin-bottom: 14px; text-align: right; }
.field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
.field input, .field select { width: 100%; padding: 12px 14px; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; outline: none; }
.field input:focus { border-color: var(--gold); }
.btn { border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; padding: 12px 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s; color: var(--bg); }
.btn:active { transform: scale(0.97); } .btn:disabled { opacity: .4; }
.btn-block { width: 100%; } .btn-gold { background: var(--gold); } .btn-teal { background: var(--teal); }
.btn-red { background: var(--red); color: #fff; } .btn-ghost { background: transparent; border: 1px solid var(--border-strong); color: var(--text); }
.btn-sm { padding: 7px 12px; font-size: 12.5px; }
.error-text { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 16px; }
.topbar { position: sticky; top: 0; background: rgba(12,15,18,.92); border-bottom: 1px solid var(--border); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
.topbar .title { font-weight: 800; font-size: 15px; } .topbar .title .gold { color: var(--gold); }
.wrap { max-width: 900px; margin: 0 auto; padding: 18px; }
.section-title { font-size: 12.5px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin: 22px 0 10px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 6px 14px; }
.list-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 4px; border-bottom: 1px solid var(--border); }
.list-row:last-child { border-bottom: none; } .row-title { font-weight: 700; font-size: 14.5px; } .row-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge-teal { background: #0f3d38; color: var(--teal); } .badge-red { background: #3d1616; color: #ff8f8f; } .badge-gold { background: #7A6330; color: var(--gold); } .badge-purple { background: #4c1d95; color: var(--purple); }
.biz-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: border-color .15s; }
.biz-card:hover { border-color: var(--gold); } .biz-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap: 12px; }
.empty { text-align: center; padding: 30px 16px; color: var(--text-dim); } .empty i { font-size: 24px; display: block; margin-bottom: 8px; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(5,6,8,.82); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
.overlay.show { display: flex; } .sheet { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 18px; width: 100%; max-width: 440px; padding: 22px 18px; }
.sheet-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; display: flex; justify-content: space-between; }
.toast { position: fixed; bottom: 24px; left: 16px; right: 16px; max-width: 480px; margin: 0 auto; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 13.5px; text-align: center; z-index: 999; display: none; color: #fff; }
.toast.success { background: #16825a; } .toast.error { background: #b3261e; }
.back-btn { color: var(--text-dim); background: none; border: none; font-size: 14px; cursor: pointer; margin-bottom: 14px; }
.code-chip { font-family: var(--font-mono); background: var(--bg-sunken); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 15px; }
</style>
</head>
<body>

<div id="loginScreen" class="screen active">
    <div class="centered-screen">
        <div class="brand-mark">🍽️ PLATE PRO</div>
        <div class="brand-title">لوحة الأدمن</div>
        <div class="card">
            <div class="field"><label>إيميل الأدمن</label><input type="email" id="adminEmail" placeholder="admin@platepro.com"></div>
            <div class="field"><label>كلمة المرور</label><input type="password" id="adminPassword" placeholder="••••••••"></div>
            <button class="btn btn-gold btn-block" onclick="handleAdminLogin()"><i class="fa-solid fa-unlock"></i> دخول</button>
            <div class="error-text" id="loginError"></div>
        </div>
    </div>
</div>

<div id="dashboardScreen" class="screen">
    <div class="topbar">
        <div class="title"><i class="fa-solid fa-shield-halved" style="color:var(--gold);"></i> <span class="gold">لوحة</span> الأدمن</div>
        <button class="btn btn-ghost btn-sm" onclick="logoutAdmin()">خروج</button>
    </div>
    <div class="wrap">
        <div class="section-title">المطاعم والكافيهات</div>
        <button class="btn btn-gold btn-block" style="margin-bottom:16px;" onclick="openCreateBusinessSheet()"><i class="fa-solid fa-plus"></i> إنشاء مطعم / كافيه جديد</button>
        <div class="biz-grid" id="businessGrid"></div>
    </div>
</div>

<div id="businessDetailScreen" class="screen">
    <div class="topbar">
        <div class="title" id="detailBizTitle">—</div>
        <button class="btn btn-ghost btn-sm" onclick="logoutAdmin()">خروج</button>
    </div>
    <div class="wrap">
        <button class="back-btn" onclick="showScreen('dashboardScreen'); loadBusinesses();"><i class="fa-solid fa-arrow-right"></i> رجوع للقائمة</button>
        <div class="section-title">بيانات المطعم / الكافيه</div>
        <div class="panel" id="detailBizInfo"></div>
        <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn btn-red btn-sm" onclick="deleteBusiness()"><i class="fa-solid fa-trash"></i> حذف النشاط</button>
            <button class="btn btn-teal btn-sm" onclick="setAllLifetime()"><i class="fa-solid fa-infinity"></i> مدى الحياة</button>
        </div>
        <div class="section-title">أكواد التفعيل</div>
        <button class="btn btn-ghost btn-block" style="margin-bottom:10px;" onclick="generateActivationCode()"><i class="fa-solid fa-key"></i> توليد كود جديد</button>
        <div class="panel" id="codesList"></div>
        <div class="section-title">الأجهزة المفعّلة</div>
        <div class="panel" id="devicesList"></div>
    </div>
</div>

<div class="overlay" id="createBusinessOverlay">
    <div class="sheet">
        <div class="sheet-title">إنشاء مطعم / كافيه جديد<button class="btn btn-ghost btn-sm" onclick="closeSheet('createBusinessOverlay')"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="field"><label>كود النشاط (إنجليزي)</label><input type="text" id="newBizCode" class="mono" style="text-transform:uppercase" placeholder="CAFE01"></div>
        <div class="field"><label>اسم المطعم / الكافيه</label><input type="text" id="newBizName" placeholder="اسم المحل"></div>
        <div class="field"><label>PIN المالك (4-8 أرقام)</label><input type="text" inputmode="numeric" maxlength="8" id="newBizPin" class="mono" placeholder="1234"></div>
        <button class="btn btn-gold btn-block" onclick="submitCreateBusiness()">إنشاء</button>
        <div class="error-text" id="createBizError"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://bccuzjjnrqnmqwcypucr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X3pnp718gcVx9-wrisvtHw_44hMVVZ_';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentBusinessId = null;

function showToast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = 'toast ' + type; el.style.display = 'block';
    clearTimeout(el._t); el._t = setTimeout(() => { el.style.display = 'none'; }, 2600);
}
function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function openSheet(id) { document.getElementById(id).classList.add('show'); }
function closeSheet(id) { document.getElementById(id).classList.remove('show'); }
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML; }
function randomCode() { const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let out = ''; for (let i = 0; i < 8; i++) { out += chars[Math.floor(Math.random() * chars.length)]; if (i === 3) out += '-'; } return out; }

// ✅ 1. تسجيل الدخول بـ Auth الحقيقي
async function handleAdminLogin() {
    const email = document.getElementById('adminEmail').value.trim();
    const pass = document.getElementById('adminPassword').value;
    const err = document.getElementById('loginError');
    err.textContent = '';
    if (!email || !pass) { err.textContent = 'اكتب الإيميل والباسورد'; return; }

    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
    if (authError) { err.textContent = 'بيانات الدخول غلط'; return; }

    if (authData.user.app_metadata?.role !== 'super_admin') { 
        await supabaseClient.auth.signOut();
        err.textContent = 'ده مش حساب أدمن!'; 
        return; 
    }
    showScreen('dashboardScreen');
    loadBusinesses();
}

async function logoutAdmin() {
    await supabaseClient.auth.signOut();
    showScreen('loginScreen');
}

// ✅ 2. تحميل قائمة المطاعم
async function loadBusinesses() {
    const grid = document.getElementById('businessGrid');
    grid.innerHTML = '<div class="empty">جاري التحميل...</div>';
    
    const { data: businesses, error } = await supabaseClient.from('businesses').select('id, name, code, created_at').order('created_at', { ascending: false });
    
    if (error) { grid.innerHTML = '<div class="empty">فشل التحميل: ' + error.message + '</div>'; return; }
    if (!businesses || businesses.length === 0) { grid.innerHTML = '<div class="empty">مفيش مطاعم لسه</div>'; return; }

    const withCounts = await Promise.all(businesses.map(async b => {
        const { count } = await supabaseClient.from('devices').select('*', { count: 'exact', head: true }).eq('business_id', b.id);
        return { ...b, deviceCount: count || 0 };
    }));

    grid.innerHTML = withCounts.map(b => `
        <div class="biz-card" onclick="openBusinessDetail('${b.id}')">
            <div class="row-title">🍽️ ${escapeHtml(b.name)}</div>
            <div class="row-sub mono">${escapeHtml(b.code)}</div>
            <div style="margin-top:10px;"><span class="badge badge-teal">${b.deviceCount} جهاز</span></div>
        </div>`).join('');
}

function openCreateBusinessSheet() {
    ['newBizCode','newBizName','newBizPin'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('createBizError').textContent = '';
    openSheet('createBusinessOverlay');
}

// ✅ 3. إنشاء مطعم عن طريق دالة RPC مش مباشر
async function submitCreateBusiness() {
    const code = document.getElementById('newBizCode').value.trim().toUpperCase();
    const name = document.getElementById('newBizName').value.trim();
    const owner_pin = document.getElementById('newBizPin').value.trim();
    const err = document.getElementById('createBizError');
    err.textContent = '';

    if (!/^[A-Z0-9\-]{3,20}$/.test(code)) { err.textContent = 'كود النشاط 3-20 حرف/رقم'; return; }
    if (!name || name.length > 100) { err.textContent = 'اكتب اسم صحيح'; return; }
    if (!/^[0-9]{4,8}$/.test(owner_pin)) { err.textContent = 'PIN من 4-8 أرقام'; return; }

    const { data: { user } } = await supabaseClient.auth.getUser();
    
    const { data: bizId, error } = await supabaseClient.rpc('create_business_admin', {
        p_code: code,
        p_name: name,
        p_owner_pin: owner_pin,
        p_admin_email: user.email
    });

    if (error) { err.textContent = 'فشل: ' + error.message; return; }
    showToast('تم إنشاء النشاط بنجاح 🎉', 'success');
    setTimeout(() => { closeSheet('createBusinessOverlay'); loadBusinesses(); }, 1500);
}

async function openBusinessDetail(id) {
    currentBusinessId = id;
    const { data: biz } = await supabaseClient.from('businesses').select('id, name, code, created_at').eq('id', id).single();
    if (!biz) return;

    document.getElementById('detailBizTitle').textContent = '🍽️ ' + biz.name;
    document.getElementById('detailBizInfo').innerHTML = `
        <div class="list-row"><div class="row-title">الكود</div><div class="code-chip">${escapeHtml(biz.code)}</div></div>
        <div class="list-row"><div class="row-title">تاريخ الإنشاء</div><div class="row-sub mono">${new Date(biz.created_at).toLocaleDateString('ar-EG')}</div></div>`;

    showScreen('businessDetailScreen');
    await Promise.all([loadCodes(id), loadDevices(id)]);
}

async function loadCodes(businessId) {
    const { data: codes } = await supabaseClient.from('activation_codes').select('*').eq('business_id', businessId).order('created_at', { ascending: false }).limit(20);
    const el = document.getElementById('codesList');
    el.innerHTML = (!codes || codes.length === 0) ? '<div class="empty">مفيش أكواد</div>' :
        codes.map(c => `<div class="list-row">
            <div><div class="code-chip">${escapeHtml(c.code)}</div><div class="row-sub">${c.used ? 'مستخدم' : 'متاح'}</div></div>
            <span class="badge ${c.used ? 'badge-red' : 'badge-teal'}">${c.used ? 'مستخدم' : 'جاهز'}</span>
        </div>`).join('');
}

async function generateActivationCode() {
    const code = randomCode();
    await supabaseClient.from('activation_codes').insert({ business_id: currentBusinessId, code });
    showToast('تم توليد: ' + code, 'success');
    loadCodes(currentBusinessId);
}

async function loadDevices(businessId) {
    const { data: devices } = await supabaseClient.from('devices').select('*').eq('business_id', businessId).order('created_at', { ascending: false });
    const el = document.getElementById('devicesList');
    el.innerHTML = (!devices || devices.length === 0) ? '<div class="empty">مفيش أجهزة</div>' :
        devices.map(d => {
            const expiry = d.expiry_date ? new Date(d.expiry_date) : null;
            const isLifetime = !expiry || expiry.getFullYear() > 2100;
            const expired = expiry && expiry < new Date() && !isLifetime;
            const statusBadge = d.revoked ? '<span class="badge badge-red">موقوف</span>' : expired ? '<span class="badge badge-gold">منتهي</span>' : isLifetime ? '<span class="badge badge-purple">♾️</span>' : '<span class="badge badge-teal">نشط</span>';
            return `<div class="list-row">
                <div><div class="row-title">${escapeHtml(d.device_label || 'جهاز')}</div></div>
                <div style="display:flex;gap:6px;">
                    ${statusBadge}
                    <button class="btn btn-ghost btn-sm" onclick="setLifetime('${d.id}')" style="color:var(--purple);"><i class="fa-solid fa-infinity"></i></button>
                    <button class="btn btn-ghost btn-sm" onclick="extendDevice('${d.id}')"><i class="fa-solid fa-calendar-plus"></i></button>
                    <button class="btn btn-ghost btn-sm" onclick="toggleRevokeDevice('${d.id}', ${d.revoked})"><i class="fa-solid ${d.revoked ? 'fa-lock-open' : 'fa-lock'}"></i></button>
                </div>
            </div>`;
        }).join('');
}

async function extendDevice(deviceId) {
    const { data: dev } = await supabaseClient.from('devices').select('expiry_date').eq('id', deviceId).single();
    if (!dev) return;
    const base = (dev.expiry_date && new Date(dev.expiry_date) > new Date()) ? new Date(dev.expiry_date) : new Date();
    base.setDate(base.getDate() + 30);
    await supabaseClient.from('devices').update({ expiry_date: base.toISOString(), is_active: true }).eq('id', deviceId);
    showToast('تم مد 30 يوم', 'success');
    loadDevices(currentBusinessId);
}

async function toggleRevokeDevice(deviceId, currentlyRevoked) {
    await supabaseClient.from('devices').update({ revoked: !currentlyRevoked }).eq('id', deviceId);
    loadDevices(currentBusinessId);
}

async function setLifetime(deviceId) {
    if (!confirm('جعل الجهاز مدى الحياة؟')) return;
    const lifetimeDate = new Date(9999, 11, 31).toISOString();
    await supabaseClient.from('devices').update({ expiry_date: lifetimeDate, is_active: true }).eq('id', deviceId);
    showToast('✅ مدى الحياة', 'success');
    loadDevices(currentBusinessId);
}

async function setAllLifetime() {
    if (!confirm('جعل كل الأجهزة مدى الحياة؟')) return;
    const lifetimeDate = new Date(9999, 11, 31).toISOString();
    await supabaseClient.from('devices').update({ expiry_date: lifetimeDate, is_active: true }).eq('business_id', currentBusinessId);
    showToast('✅ تم التحديث', 'success');
    loadDevices(currentBusinessId);
}

// ✅ 4. الحذف شغال 100% وهيظهر فوراً
async function deleteBusiness() {
    if (!confirm('متأكد؟ هيتمسح كل حاجة نهائي.')) return;
    const { error } = await supabaseClient.from('businesses').delete().eq('id', currentBusinessId);
    if (error) { showToast('فشل الحذف: ' + error.message, 'error'); return; }
    showToast('تم الحذف', 'success');
    showScreen('dashboardScreen');
    loadBusinesses();
}
</script>
</body>
</html>
